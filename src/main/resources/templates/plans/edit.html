<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="'Edit ' + ${plan.name} + ' — Plan Platform'">Edit Plan</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}" href="/css/styles.css">
</head>
<body>
    <header class="brand-header">
        <a th:href="@{/}" href="/" class="brand-title">
            <span>📱</span> Mobile Plan Recommendation Platform
        </a>
        <div class="nav-links">
            <a th:href="@{/plans}" class="nav-link">Catalogue</a>
            <span class="badge-role" th:text="${currentRole}">ANALYST</span>
        </div>
    </header>

    <main class="container">
        <div class="form-card">
            <div class="page-header" style="margin-bottom: 1.5rem;">
                <div>
                    <h1 class="page-title">Edit Plan Tariff</h1>
                    <p class="page-subtitle">Update plan attributes. Changes are recorded in the audit trail.</p>
                </div>
                <a th:href="@{/plans/{id}(id=${plan.id})}" class="btn-secondary-mpr btn-sm">← Back to Details</a>
            </div>

            <div th:if="${errorMessage}" class="alert form-error" style="background: #FEE2E2; padding: 0.75rem; border-radius: 8px; margin-bottom: 1rem;" th:text="${errorMessage}">
                Error
            </div>

            <form th:action="@{/plans/{id}/edit(id=${plan.id})}" th:object="${plan}" method="post">
                <div class="form-grid-2">
                    <div class="form-group">
                        <label class="form-label" for="operator">Operator *</label>
                        <select id="operator" th:field="*{operator}" class="form-control">
                            <option value="Jio">Jio</option>
                            <option value="Airtel">Airtel</option>
                            <option value="Vodafone Idea">Vodafone Idea (Vi)</option>
                            <option value="BSNL">BSNL</option>
                        </select>
                        <div class="form-error" th:if="${#fields.hasErrors('operator')}" th:errors="*{operator}"></div>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="name">Plan Name *</label>
                        <input type="text" id="name" th:field="*{name}" class="form-control" required>
                        <div class="form-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                    </div>
                </div>

                <div class="form-grid-2">
                    <div class="form-group">
                        <label class="form-label" for="price">Price (₹ INR) *</label>
                        <input type="number" step="0.01" id="price" th:field="*{price}" class="form-control" required>
                        <div class="form-error" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></div>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="validityDays">Validity (Days) *</label>
                        <input type="number" id="validityDays" th:field="*{validityDays}" class="form-control" required>
                        <div class="form-error" th:if="${#fields.hasErrors('validityDays')}" th:errors="*{validityDays}"></div>
                    </div>
                </div>

                <div class="form-grid-2">
                    <div class="form-group">
                        <label class="form-label" for="dataGbPerDay">Daily Data Quota (GB/day) *</label>
                        <input type="number" step="0.1" id="dataGbPerDay" th:field="*{dataGbPerDay}" class="form-control" required>
                        <div class="form-error" th:if="${#fields.hasErrors('dataGbPerDay')}" th:errors="*{dataGbPerDay}"></div>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="voiceMinutes">Voice Minutes * (-1 for Unlimited)</label>
                        <input type="number" id="voiceMinutes" th:field="*{voiceMinutes}" class="form-control" required>
                        <div class="form-error" th:if="${#fields.hasErrors('voiceMinutes')}" th:errors="*{voiceMinutes}"></div>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="smsCount">Daily SMS Quota *</label>
                    <input type="number" id="smsCount" th:field="*{smsCount}" class="form-control" required>
                    <div class="form-error" th:if="${#fields.hasErrors('smsCount')}" th:errors="*{smsCount}"></div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="benefits">Bundled Perks & Benefits</label>
                    <textarea id="benefits" th:field="*{benefits}" class="form-control" rows="3"></textarea>
                    <div class="form-error" th:if="${#fields.hasErrors('benefits')}" th:errors="*{benefits}"></div>
                </div>

                <div style="display: flex; gap: 1rem; margin-top: 2rem;">
                    <button type="submit" class="btn-primary-mpr">Save Changes</button>
                    <a th:href="@{/plans/{id}(id=${plan.id})}" class="btn-secondary-mpr">Cancel</a>
                </div>
            </form>
        </div>
    </main>
</body>
</html>
