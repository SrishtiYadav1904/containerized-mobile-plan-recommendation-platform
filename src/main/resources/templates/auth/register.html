<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account — Mobile Plan Recommendation Platform</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}" href="/css/styles.css">
</head>
<body>
    <header class="brand-header">
        <a th:href="@{/}" href="/" class="brand-title">
            <span>📱</span> Mobile Plan Recommendation Platform
        </a>
        <div class="nav-links">
            <a th:href="@{/plans}" class="nav-link">Catalogue</a>
            <a th:href="@{/login}" class="btn-secondary-mpr btn-sm">Sign In</a>
        </div>
    </header>

    <main class="container">
        <div class="form-card" style="max-width: 520px;">
            <div class="page-header" style="justify-content: center; text-align: center; margin-bottom: 1.5rem;">
                <div>
                    <h1 class="page-title">Register Account</h1>
                    <p class="page-subtitle">Join the Mobile Plan Recommendation Platform</p>
                </div>
            </div>

            <div th:if="${errorMessage}" class="alert form-error" style="background: #FEE2E2; padding: 0.75rem; border-radius: 8px; margin-bottom: 1rem;" th:text="${errorMessage}">
                Error message
            </div>

            <form th:action="@{/register}" method="post">
                <div class="form-group">
                    <label class="form-label" for="name">Full Name *</label>
                    <input type="text" id="name" name="name" th:value="${name}" class="form-control" placeholder="e.g. Srishti Yadav" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="email">Email Address *</label>
                    <input type="email" id="email" name="email" th:value="${email}" class="form-control" placeholder="name@example.com" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">Password * (min 6 characters)</label>
                    <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" minlength="6" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="role">Requested Role *</label>
                    <select id="role" name="role" class="form-control">
                        <option value="CUSTOMER" th:selected="${role == 'CUSTOMER'}">Customer (Browse tariffs & receive recommendations)</option>
                        <option value="ANALYST" th:selected="${role == 'ANALYST'}">Plan Analyst (Create & maintain tariffs)</option>
                        <option value="ADMINISTRATOR" th:selected="${role == 'ADMINISTRATOR'}">Administrator (Publish tariffs & manage system)</option>
                    </select>
                </div>

                <button type="submit" class="btn-primary-mpr" style="width: 100%; justify-content: center; margin-top: 1.25rem;">
                    Complete Registration
                </button>
            </form>

            <div style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: var(--text-muted);">
                Already have an account? <a th:href="@{/login}" style="color: var(--accent-pink); font-weight: 600;">Sign in</a>
            </div>
        </div>
    </main>
</body>
</html>
