# ===================================================================
# Containerized Mobile Plan Recommendation Platform Configuration
# ===================================================================

spring.application.name=containerized-mobile-plan-recommendation-platform

# Server Configuration
# Note: Host ports 8072, 8081, 8082 are reserved for other projects.
# Standalone default: 8080 (container internal), Tomcat host port: 8084, Docker host port: 8085
server.port=${PORT:8080}
server.servlet.context-path=/

# Database Configuration
# Default: In-memory H2 database for testing and immediate local out-of-the-box startup.
# Production / Local MySQL 8: Overridden via environment variables DB_URL, DB_USER, DB_PASS, DB_DRIVER
spring.datasource.url=${DB_URL:jdbc:h2:mem:mpr_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driverClassName=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASS:}

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=${JPA_DDL:update}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Actuator & Health Check
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

