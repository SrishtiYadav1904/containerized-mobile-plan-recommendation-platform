# ==============================================================================
# Ansible Production Inventory - Mobile Plan Recommendation Platform
# Note: Never commit credentials, tokens, passwords, or private SSH keys.
# Supply secrets via Jenkins credentials, environment variables, or Ansible Vault.
# ==============================================================================

all:
  children:
    mpr_servers:
      hosts:
        mpr-prod-node-01:
          ansible_host: "192.168.1.100"                      # Replace with target host IP/FQDN
          ansible_port: 22                                   # SSH management port
          ansible_user: "deployer"                           # Dedicated non-root deployment user
          ansible_ssh_private_key_file: "~/.ssh/mpr_deployer_key" # Injected by CI/CD runner
          ansible_python_interpreter: "/usr/bin/python3"
        # Example standby/secondary node
        # mpr-prod-node-02:
        #   ansible_host: "192.168.1.101"
        #   ansible_port: 22
        #   ansible_user: "deployer"
        #   ansible_ssh_private_key_file: "~/.ssh/mpr_deployer_key"
        #   ansible_python_interpreter: "/usr/bin/python3"

  vars:
    deployment_environment: "production"
